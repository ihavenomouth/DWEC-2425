<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/index.js" defer></script>
</head>
<body>
  <h1>Express</h1>
  <p>Sirviendo ficheros estáticos de Node JS</p>
  <form action="/api/producto/add" method="GET">
    <label>Datos: <br>
      <input type="text" name="txtDato" id="txtDato" value="bicicleta">
    </label>
    <br>
    <p>Selecciona el valor</p>
    <select name="sltValor">
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="30">30</option>
    </select>
    <br>

    <label>
      <input type="checkbox" name="chkAceptar" id="chkAceptar">
      Acepta los términos del contrato
    </label>

    <fieldset>
      <legend>Elija un color</legend>
      <label>
        <input type="radio" name="radio" value="red" checked> Rojo
      </label>
      <br>
      <label>
        <input type="radio" name="radio" value="green"> Verde
      </label>
      <br>
      <label>
        <input type="radio" name="radio" value="blue"> Azul
      </label>
      <br>
    </fieldset>

    <button id="btnEnviar">Enviar</button>
    <button  type="button" id="btnEnviarPOST">Enviar POST con JSON</button>
  </form>

  <div id="divResultado"></div>
</body>
</html>
