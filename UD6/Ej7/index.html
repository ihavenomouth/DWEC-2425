<body>
  <h1>Ejercicio 7</h1>
  
  <p><strong>Ejercicio 7</strong>: haz una aplicación que permita gestionar una lista de tareas, incluyendo guardar las tareas realizadas y las no realizadas en el localStorage. Cada vez que se añada una tarea o se complete una tarea, se actualizará el localStorage. </p>

  <form>
    <label>
      Tarea <input type="text" id="txtTarea">
    </label>
    <button type="button" id="btnAnadir">Añadir tarea</button>
    <button type="button" id="btnGuardar">Guardar tareas</button>
    <button type="button" id="btnRecuperar">Recuperar tareas</button>
  </form>

  <ul id="listaTareas"></ul>
